name: Daily Pokemon GO news refresh
on:
  schedule:
    - cron: '0 21 * * *' # 06:00 Asia/Seoul (UTC+9)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: raid-dex-pages
jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_news.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/updates.json
          git diff --cached --quiet || (git commit -m "Update Pokemon GO news" && git push)
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p site/data
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png site/
          cp data/updates.json site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
